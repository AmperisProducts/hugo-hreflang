name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        hugo: ["0.158.0", "latest"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: hugo-hreflang

      - name: Install Hugo ${{ matrix.hugo }}
        env:
          GH_TOKEN: ${{ github.token }}
          HUGO: ${{ matrix.hugo }}
        run: |
          v="$HUGO"
          if [ "$v" = latest ]; then
            v=$(gh api repos/gohugoio/hugo/releases/latest --jq .tag_name | tr -d v)
          fi
          curl -sfL -o hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${v}/hugo_${v}_linux-amd64.tar.gz"
          mkdir -p "$HOME/.local/hugo" && tar -C "$HOME/.local/hugo" -xf hugo.tar.gz hugo
          echo "$HOME/.local/hugo" >> "$GITHUB_PATH"

      - name: Build the example site
        working-directory: hugo-hreflang/exampleSite
        run: |
          hugo version
          hugo build --logLevel warn --panicOnWarning

      - name: Check the output
        working-directory: hugo-hreflang/exampleSite
        run: |
          set -e
          grep -q 'hreflang="es-ES" href="https://example.org/es/productos/medidor-aislamiento/"' public/products/tester/index.html
          grep -q 'hreflang="x-default" href="https://example.org/products/tester/"' public/products/tester/index.html
          ! grep -q '<link rel="alternate"' public/fr/produits/testeur/index.html
          ! grep -q '<link rel="alternate"' public/only-english/index.html
          grep -q 'aria-current="true"' public/index.html
          grep -q 'href="https://example.org/es/" lang="es-ES"' public/only-english/index.html
